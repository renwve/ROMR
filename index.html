<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Romr – Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div class="logo">ROMR</div>
      <button class="btn small" id="themeBtn" aria-label="Toggle dark mode"></button>
    </div>

    <section class="card">
      <div class="top">
        <div class="avatar" id="avatar"></div>
        <div class="who">
          <h1 id="displayName"></h1>
          <div class="handle" id="username"></div>
        </div>
        <button class="btn" id="editBtn">Edit profile</button>
      </div>
      <p class="bio" id="bio"></p>
      <div class="stats">
        <button class="stat" id="followersBtn"><b id="followers">0</b><span>Followers</span></button>
        <button class="stat" id="followingBtn"><b id="following">0</b><span>Following</span></button>
        <div class="stat"><b id="unlockedCount">0</b><span>Achievements</span></div>
      </div>
    </section>

    <h2>World map</h2>
    <section class="card">
      <b id="pct">0%</b> <span class="muted" id="mapCount"></span>
      <div class="bar"><i id="fill"></i></div>
      <div class="mapbox" id="mapBox"><div class="tip" id="tip"></div></div>
      <p class="muted" id="mapHint"></p>
    </section>

    <div class="row">
      <h2>Trip history</h2>
      <button class="btn small primary" id="addTripBtn">+ Add trip</button>
    </div>
    <div class="trips" id="trips"></div>

    <h2>Achievements</h2>
    <p class="muted" id="summary"></p>
    <div id="grid"></div>

    <label class="demo">
      <input type="checkbox" id="demoMode"> Demo mode (click countries to light them up, click an achievement to unlock it)
    </label>
    <div class="demo-tools" id="demoTools">
      <button class="btn small" id="visitAll">Visit everything</button>
      <button class="btn small" id="clearDemo">Clear demo visits</button>
    </div>
    <button class="link" id="resetBtn">Reset profile</button>
  </main>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h3>Edit profile</h3>
      <div class="pic-row">
        <div class="avatar" id="previewAvatar"></div>
        <div class="pic-btns">
          <label class="btn small">Change photo<input type="file" id="photoInput" accept="image/*" hidden></label>
          <button type="button" class="btn small ghost" id="removePhoto">Remove</button>
        </div>
      </div>
      <label>Name <input type="text" id="nameInput" maxlength="40" required></label>
      <label>Username <input type="text" id="userInput" maxlength="20" required></label>
      <small class="error" id="userError"></small>
      <label>Bio <textarea id="bioInput" maxlength="150" rows="3"></textarea></label>
      <small class="muted" id="bioCount">0/150</small>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="tripDialog">
    <form id="tripForm" method="dialog">
      <h3>Add trip</h3>
      <label>Place <input type="text" id="tPlace" maxlength="60" placeholder="e.g. Kyoto" required></label>
      <label>Country <select id="tCountry" required></select></label>
      <div class="dates">
        <label>Start <input type="date" id="tStart" required></label>
        <label>End <input type="date" id="tEnd" required></label>
      </div>
      <label>Note <textarea id="tNote" maxlength="120" rows="2"></textarea></label>
      <label class="check"><input type="checkbox" id="tEverest"> Climbed Mount Everest on this trip 🏔️</label>
      <small class="error" id="tError"></small>
      <div class="actions">
        <button type="button" class="btn ghost" id="tCancel">Cancel</button>
        <button type="submit" class="btn primary">Save trip</button>
      </div>
    </form>
  </dialog>

  <dialog id="peopleDialog">
    <div class="tabs">
      <button class="btn small" id="tabFollowers">Followers</button>
      <button class="btn small" id="tabFollowing">Following</button>
    </div>
    <div class="people" id="people"></div>
    <div class="actions"><button class="btn" id="peopleClose">Close</button></div>
  </dialog>

  <script src="js/map-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
